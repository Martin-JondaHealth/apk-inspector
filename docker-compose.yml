version: '3.8'

services:
  apk-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apk-inspector
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      # - GEMINI_API_KEY=your_gemini_api_key_here
      # - OPENAI_API_KEY=your_openai_api_key_here
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
